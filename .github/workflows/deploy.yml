name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Права, необходимые для публикации через GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно выполняется только один деплой
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Сайт статический, сборка не нужна — публикуем содержимое репозитория
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

