<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — страница не найдена</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236d8dff'/%3E%3Ctext x='32' y='43' font-family='system-ui, sans-serif' font-size='26' font-weight='700' fill='%23fff' text-anchor='middle'%3EAP%3C/text%3E%3C/svg%3E">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.dataset.theme = saved || (prefersLight ? 'light' : 'dark');
      } catch (e) { /* ignore */ }
    })();
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b14;
      --text: #e9edf7;
      --muted: #98a4be;
      --border: rgba(255, 255, 255, 0.12);
      --brand: #6d8dff;
      --brand-3: #b388ff;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f5f7fd;
      --text: #0e1424;
      --muted: #5a6580;
      --border: rgba(16, 22, 45, 0.14);
      --brand: #3b5bdb;
      --brand-3: #8b5cf6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(700px 420px at 20% 0%, rgba(109, 141, 255, 0.18), transparent 65%),
        radial-gradient(700px 420px at 80% 100%, rgba(179, 136, 255, 0.18), transparent 65%),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.6;
      text-align: center;
    }

    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(4rem, 18vw, 7rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      margin: 0;
      background: linear-gradient(100deg, var(--brand), var(--brand-3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p { color: var(--muted); margin: 0 0 26px; }

    .link {
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .link:hover { border-color: var(--brand); transform: translateY(-2px); }

    .hint { margin-top: 22px; font-size: 0.8rem; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка.</p>
    <!-- Для сайта-проекта (username.github.io/repo) замените href на /repo/ -->
    <a class="link" href="/">Вернуться на главную</a>
    <p class="hint">Или нажмите «Назад» в браузере.</p>
  </main>
</body>
</html>
