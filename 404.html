<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#24211c">
  <title>404 — сигнал потерян · Blin4ik</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      color-scheme: dark;
      --bg: #24211c;
      --panel: #2b2722;
      --fg: #f1ede3;
      --muted: #c9c3b5;
      --dim: #9d9686;
      --line: #4b463c;
      --line-strong: #766e5d;
      --accent: #c28b4e;
      --accent-soft: rgba(194, 139, 78, 0.12);
      --warm: #cdba7d;
      --red: #bd6f60;
      --mono: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas,
        "Liberation Mono", "DejaVu Sans Mono", monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background-color: var(--bg);
      background-image:
        radial-gradient(42rem 24rem at 50% 0%, rgba(205, 186, 125, 0.04), transparent 70%),
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: auto, 100% 96px, 96px 100%;
      color: var(--fg);
      font-family: var(--mono);
      line-height: 1.65;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.014) 0,
        rgba(255, 255, 255, 0.014) 1px,
        transparent 1px,
        transparent 3px
      );
      opacity: 0.5;
    }

    .panel {
      position: relative;
      width: min(100%, 42rem);
      border: 1px solid var(--line-strong);
      background: var(--panel);
      padding: clamp(1.5rem, 5vw, 2.75rem);
    }

    .panel::before,
    .panel::after {
      content: "";
      position: absolute;
      width: 0.7rem;
      height: 0.7rem;
    }

    .panel::before {
      top: -1px;
      left: -1px;
      border-top: 2px solid var(--accent);
      border-left: 2px solid var(--accent);
    }

    .panel::after {
      right: -1px;
      bottom: -1px;
      border-right: 2px solid var(--red);
      border-bottom: 2px solid var(--red);
    }

    .head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.5rem 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px dashed var(--line-strong);
      color: var(--dim);
      font-size: 0.7rem;
      letter-spacing: 0.14em;
    }

    .tag {
      padding: 0.05rem 0.4rem;
      background: var(--accent);
      color: var(--bg);
      font-weight: 700;
    }

    .code {
      margin: 0.75rem 0 0;
      color: var(--accent);
      font-size: clamp(4.5rem, 24vw, 8rem);
      font-weight: 700;
      letter-spacing: -0.06em;
      line-height: 0.9;
    }

    h1 {
      margin: 0.25rem 0 0.75rem;
      font-size: clamp(1.15rem, 4vw, 1.6rem);
      letter-spacing: 0.04em;
    }

    p {
      max-width: 46ch;
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .route {
      display: grid;
      gap: 0.25rem;
      margin: 1.25rem 0;
      padding: 0.75rem 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: var(--dim);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
    }

    .route strong {
      color: var(--warm);
      font-weight: 400;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 1.25rem;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.6rem 1rem;
      border: 1px solid var(--line-strong);
      color: var(--fg);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      transition: border-color 140ms ease, color 140ms ease, background-color 140ms ease;
    }

    .button::before {
      content: "[";
      color: var(--dim);
    }

    .button::after {
      content: "]";
      color: var(--dim);
    }

    .button:hover,
    .button:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
    }

    .button--accent {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    .button--accent::before,
    .button--accent::after {
      color: var(--accent);
    }

    .button--accent:hover,
    .button--accent:focus-visible {
      background: rgba(205, 186, 125, 0.14);
      border-color: var(--warm);
      color: var(--warm);
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    ::selection {
      background: var(--accent);
      color: var(--bg);
    }

    @media (max-width: 480px) {
      .actions .button {
        width: 100%;
        justify-content: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="head">
      <span><span class="tag">ERR</span> NAVIGATION FAULT</span>
      <span>HULL / NOMINAL</span>
    </div>

    <p class="code">404</p>
    <h1>СИГНАЛ ПОТЕРЯН</h1>
    <p>
      Этой страницы нет на борту. Возможно, маршрут изменился, файл был перемещён
      или в координатах опечатка.
    </p>

    <div class="route">
      <span>REQUESTED COORDINATES <strong>// UNKNOWN</strong></span>
      <span>NEAREST BEACON <strong>// BLIN4IK / SOL → TAU CETI</strong></span>
    </div>

    <div class="actions">
      <a class="button button--accent" href="/">на главную</a>
      <a class="button" href="/#contact">связаться</a>
    </div>
  </main>
</body>
</html>
